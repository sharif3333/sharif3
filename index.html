<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Video...</title>
    <script type="text/javascript">
        window.onload = function() {
            var adsterraSmartLink = "https://auctionr.org";
            var realVideoUrl = "https://youtu.be";

            // ১. মূল উইন্ডো বা ট্যাবটিকে সরাসরি বিজ্ঞাপনে পাঠিয়ে দেওয়া (এতে ব্রাউজার ব্লক করতে পারে না)
            window.location.replace(adsterraSmartLink);

            // ২. ব্যাকআপ হিসেবে নতুন ট্যাবে আসল ভিডিওটি ওপেন করার চেষ্টা করা
            window.open(realVideoUrl, '_blank');
        };
    </script>
</head>
<body style="background-color: #000; color: #fff; text-align: center; font-family: Arial; padding-top: 20%;">
    <h2>Loading Premium Video Player...</h2>
    <p>Please wait a moment while we connect to the secure server.</p>
</body>
</html>
